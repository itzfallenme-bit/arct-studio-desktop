[package]
name = "arct-studio"
version = "0.1.0"
description = "Arct Studio - every Arct tool in one desktop app"
authors = ["Arct Development"]
license = "AGPL-3.0-only"
repository = "https://github.com/itzfallenme-bit/arct-studio-desktop"
edition = "2021"
rust-version = "1.77"

[lib]
name = "arct_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
